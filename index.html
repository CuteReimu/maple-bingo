<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>名侦探甘迪助手</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #e8f4fd 0%, #fef9f0 100%);
      min-height: 100vh;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .page-container { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    .page-title { text-align: center; margin-bottom: 28px; }
    .page-title h1 { font-size: 28px; font-weight: 700; color: #1a3a5c; margin: 0 0 6px; }
    .page-title p { color: #666; font-size: 14px; margin: 0; }
    .card-gap { margin-bottom: 16px; }
    .guess-display {
      display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 0;
    }
    .guess-digit {
      width: 56px; height: 56px; border-radius: 12px;
      background: linear-gradient(135deg, #409eff, #2b7fd4);
      color: white; font-size: 28px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(64,158,255,0.35);
    }
    .guess-sep { font-size: 22px; color: #aaa; font-weight: 300; }
    .feedback-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 8px; }
    .feedback-item { display: flex; align-items: center; gap: 8px; }
    .feedback-label { font-size: 16px; font-weight: 600; min-width: 28px; }
    .circle-label { color: #e6523a; }
    .triangle-label { color: #e6a817; }
    .history-guess { font-family: monospace; font-weight: 700; letter-spacing: 3px; font-size: 16px; color: #303133; }
    .stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat-item { flex: 1; min-width: 120px; background: #f4f9ff; border-radius: 10px; padding: 12px 16px; text-align: center; }
    .stat-val { font-size: 24px; font-weight: 700; color: #409eff; }
    .stat-desc { font-size: 12px; color: #888; margin-top: 2px; }
    .entropy-badge {
      display: inline-block; font-size: 12px; color: #909399;
      background: #f5f7fa; border-radius: 8px; padding: 2px 8px; margin-left: 8px;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="page-container">

    <div class="page-title">
      <h1>🔍 名侦探甘迪助手</h1>
      <p>基于最大化信息熵策略，帮你以最少次数猜出答案</p>
    </div>

    <!-- 状态统计 -->
    <el-card class="card-gap" shadow="hover">
      <div class="stat-row">
        <div class="stat-item">
          <div class="stat-val">{{ possibleCount }}</div>
          <div class="stat-desc">剩余可能数</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">{{ round }}</div>
          <div class="stat-desc">已猜次数</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">{{ currentEntropy }}</div>
          <div class="stat-desc">当前猜测信息熵 (bits)</div>
        </div>
      </div>
    </el-card>

    <!-- 已解决 -->
    <el-card v-if="solved" class="card-gap" shadow="hover">
      <el-result icon="success" :title="'答案是 ' + formatGuess(currentGuess)" sub-title="恭喜猜出答案！">
        <template #extra>
          <el-button type="primary" @click="reset">重新开始</el-button>
        </template>
      </el-result>
    </el-card>

    <!-- 无解 -->
    <el-card v-else-if="noSolution" class="card-gap" shadow="hover">
      <el-result icon="error" title="无解" sub-title="输入的反馈存在矛盾，请检查后重置重来">
        <template #extra>
          <el-button type="danger" @click="reset">重置</el-button>
        </template>
      </el-result>
    </el-card>

    <!-- 当前建议 + 输入反馈 -->
    <el-card v-else class="card-gap" shadow="hover">
      <template #header>
        <span style="font-weight:600;">第 {{ round + 1 }} 轮建议猜测</span>
        <span class="entropy-badge">信息熵最优</span>
      </template>

      <div class="guess-display">
        <div class="guess-digit">{{ digits(currentGuess)[0] }}</div>
        <span class="guess-sep">-</span>
        <div class="guess-digit">{{ digits(currentGuess)[1] }}</div>
        <span class="guess-sep">-</span>
        <div class="guess-digit">{{ digits(currentGuess)[2] }}</div>
      </div>

      <el-divider>输入系统反馈</el-divider>

      <div class="feedback-row">
        <div class="feedback-item">
          <span class="feedback-label circle-label">○</span>
          <span style="font-size:13px;color:#666;">数字且位置正确</span>
          <el-input-number v-model="inputCircle" :min="0" :max="3" size="small" style="width:110px;" />
        </div>
        <div class="feedback-item">
          <span class="feedback-label triangle-label">△</span>
          <span style="font-size:13px;color:#666;">数字正确位置错误</span>
          <el-input-number v-model="inputTriangle" :min="0" :max="3" size="small" style="width:110px;" />
        </div>
      </div>

      <div style="margin-top:16px;display:flex;gap:12px;">
        <el-button type="primary" @click="confirm" :disabled="inputCircle + inputTriangle > 3">
          确认反馈
        </el-button>
        <el-button @click="reset">重置</el-button>
      </div>
    </el-card>

    <!-- 历史记录 -->
    <el-card v-if="history.length > 0" shadow="hover">
      <template #header>
        <span style="font-weight:600;">猜测历史</span>
      </template>
      <el-table :data="history" stripe size="small">
        <el-table-column label="轮次" width="70">
          <template #default="{ row }">第 {{ row.round }} 轮</template>
        </el-table-column>
        <el-table-column label="猜测">
          <template #default="{ row }">
            <span class="history-guess">{{ formatGuess(row.guess) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="反馈">
          <template #default="{ row }">
            <el-tag type="danger" size="small" style="margin-right:4px;">○ {{ row.circle }}</el-tag>
            <el-tag type="warning" size="small">△ {{ row.triangle }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="剩余可能" width="90">
          <template #default="{ row }">
            <el-tag size="small" type="info">{{ row.remaining }}</el-tag>
          </template>
        </el-table-column>
      </el-table>
    </el-card>

  </div>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="main.js"></script>
</body>
</html>
